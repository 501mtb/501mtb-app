name: Publish latest signed Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-test-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ 100000 + github.run_number }}
      ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret $name is missing."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/501mtb-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/501mtb-signing/release.jks"
          test -s "$RUNNER_TEMP/501mtb-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/501mtb-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Verify APK signature matches the currently published APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

          mkdir -p "$RUNNER_TEMP/501mtb-previous"
          gh release download latest-test --pattern "501MTB.apk" --dir "$RUNNER_TEMP/501mtb-previous"
          OLD_APK="$RUNNER_TEMP/501mtb-previous/501MTB.apk"
          test -s "$OLD_APK"
          apksigner verify --verbose "$OLD_APK"

          cert_digest() {
            apksigner verify --print-certs "$1" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}'
          }

          OLD_CERT="$(cert_digest "$OLD_APK")"
          NEW_CERT="$(cert_digest "$APK")"
          if [[ -z "$OLD_CERT" || -z "$NEW_CERT" || "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::Signing certificate mismatch. Existing latest-test APK was not replaced."
            exit 1
          fi
          echo "Signing certificate matches the currently published APK."

      - name: Publish APK to stable latest-test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest-test "app/build/outputs/apk/release/app-release.apk#501MTB.apk" --clobber

