name: Android debug build and tests

on:
  push:
    branches: [main, "initial/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firestore rules test dependencies
        working-directory: tests/firestore-rules
        run: npm install --no-audit --no-fund

      - name: Test Firestore security rules in local emulator
        working-directory: tests/firestore-rules
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run member registry unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Print Android signing fingerprints
        run: gradle signingReport

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 501mtb-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
