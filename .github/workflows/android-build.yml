name: Android build and latest test APK

on:
  push:
    branches: [main, "initial/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 501mtb-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare friendly APK filename
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk 501MTB.apk

      - name: Publish latest test APK for the website
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          target_commitish: ${{ github.sha }}
          name: 501MTB App — Latest test build
          body: |
            Latest automatically generated test APK from feature/shared-photo-library.

            This is a development build, not a production release.
          prerelease: true
          make_latest: false
          files: 501MTB.apk
          overwrite_files: true
          fail_on_unmatched_files: true
