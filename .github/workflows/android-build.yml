name: Android build and latest signed APK

on:
  push:
    branches: [main, "initial/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK for CI verification
        run: gradle assembleDebug

      - name: Upload debug CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: 501mtb-app-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing secrets
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent Android signing is not configured. Add the four ANDROID_* repository secrets before publishing an installable update."
            exit 1
          fi

      - name: Decode permanent Android signing key
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/501mtb-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/501mtb-release.jks" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare download filename
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk 501MTB.apk

      - name: Publish latest signed APK
        if: github.ref == 'refs/heads/feature/shared-photo-library' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          target_commitish: ${{ github.sha }}
          name: 501MTB App — Latest signed test build
          body: |
            Latest automatically generated, permanently signed Android test build.
            Install this APK over the previous app to update it without uninstalling.
          prerelease: true
          make_latest: false
          files: 501MTB.apk
          overwrite_files: true
          fail_on_unmatched_files: true
